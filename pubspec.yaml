name: mobile_webcam
description: "A mobile live stream camera app for Windows 11"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  network_info_plus: ^5.0.1
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
