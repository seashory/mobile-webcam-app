name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      # 1. lib ഫോൾഡർ താൽക്കാലികമായി മാറ്റിവെച്ച് പ്രൊജക്റ്റ് സ്ട്രക്ചർ ഉണ്ടാക്കുന്നു
      - name: Reconstruct Android Structure
        run: |
          mkdir -p lib_temp
          cp -r lib/* lib_temp/
          flutter create . --project-name=mobile_webcam_app --platforms=android --org=com.example --overwrite
          cp -r lib_temp/* lib/
          rm -rf lib_temp

      # 2. Fast Download-നായി Gradle Wrapper URL 'bin.zip' ആക്കി മാറ്റുന്നു
      - name: Optimize Gradle Distribution URL
        run: |
          sed -i 's/gradle-7.6.3-all.zip/gradle-7.6.3-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties

      # 3. minSdkVersion 21 ആക്കി അപ്‌ഡേറ്റ് ചെയ്യുന്നു
      - name: Update minSdkVersion to 21
        run: |
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle

      # 4. വിട്ടുപോയ എല്ലാ പാക്കേജുകളും ചേർക്കുന്നു
      - name: Add Required Dependencies
        run: |
          flutter pub add camera shelf shelf_router network_info_plus permission_handler cupertino_icons

      # 5. Dependencies Fetch ചെയ്യുന്നു
      - name: Get Dependencies
        run: flutter pub get

      # 6. Gradle Network 504 Timeout തടയാൻ Retry Logic ഉപയോഗിച്ച് APK ബിൽഡ് ചെയ്യുന്നു
      - name: Build APK with Retry
        run: |
          n=0
          until [ "$n" -ge 3 ]
          do
             flutter build apk --release --no-tree-shake-icons && break
             n=$((n+1))
             echo "Build failed due to network timeout, retrying ($n/3)..."
             sleep 5
          done

      # 7. Artifact അപ്‌ലോഡ് ചെയ്യുന്നു
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Stream-Cam-APK
          path: build/app/outputs/flutter-apk/app-release.apk
