name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      # 1. വിട്ടുപോയ എല്ലാ Android/Gradle ഫയലുകളും സ്വയം നിർമ്മിക്കുന്നു
      - name: Reconstruct Full Flutter Android Project
        run: flutter create . --platforms=android --org=com.example

      # 2. Dependencies അപ്‌ഡേറ്റ് ചെയ്യുന്നു
      - name: Get Dependencies
        run: flutter pub get

      # 3. Release APK ബിൽഡ് ചെയ്യുന്നു
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      # 4. APK അപ്‌ലോഡ് ചെയ്യുന്നു (v4)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Stream-Cam-APK
          path: build/app/outputs/flutter-apk/app-release.apk
