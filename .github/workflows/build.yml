name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      # 1. Project Structure Reconstruct ചെയ്യൽ
      - name: Reconstruct Android Structure
        run: |
          mkdir -p lib_temp
          cp -r lib/* lib_temp/
          flutter create . --project-name=mobile_webcam_app --platforms=android --org=com.example --overwrite
          cp -r lib_temp/* lib/
          rm -rf lib_temp

      # 2. Fast Download-നായി Gradle Distribution URL മാറ്റുന്നു
      - name: Optimize Gradle Distribution URL
        run: |
          sed -i 's/gradle-7.6.3-all.zip/gradle-7.6.3-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties

      # 3. minSdkVersion 21 ആക്കി ഉയർത്തുന്നു
      - name: Update minSdkVersion to 21
        run: |
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle

      # 4. വിട്ടുപോയ എല്ലാ പാക്കേജുകളും ചേർക്കുന്നു
      - name: Add Required Dependencies
        run: |
          flutter pub add camera shelf shelf_router network_info_plus permission_handler cupertino_icons

      # 5. Dependencies Fetch ചെയ്യുന്നു
      - name: Get Dependencies
        run: flutter pub get

      # 6. APK ബിൽഡ് ചെയ്യുന്നു
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      # 7. ജനറേറ്റ് ചെയ്ത APK ഫയൽ കൃത്യമായി കണ്ടെത്തുന്നുണ്ടോ എന്ന് തപ്പുക
      - name: Verify APK Generated
        run: ls -la build/app/outputs/flutter-apk/

      # 8. Artifact സുരക്ഷിതമായി അപ്‌ലോഡ് ചെയ്യുന്നു
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Stream-Cam-APK
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
