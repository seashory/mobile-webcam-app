name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Missing Kotlin File
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/mobile_webcam
          echo 'package com.example.mobile_webcam' > android/app/src/main/kotlin/com/example/mobile_webcam/MainActivity.kt
          echo 'import io.flutter.embedding.android.FlutterActivity' >> android/app/src/main/kotlin/com/example/mobile_webcam/MainActivity.kt
          echo 'class MainActivity: FlutterActivity() {}' >> android/app/src/main/kotlin/com/example/mobile_webcam/MainActivity.kt

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Stream-Cam-APK
          path: build/app/outputs/flutter-apk/app-release.apk
