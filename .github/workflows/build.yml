name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Recreate Clean Android Configuration
        run: |
          rm -rf android
          flutter create . --project-name=mobile_webcam_app --platforms=android
          flutter pub get

      # minSdk 21 ആക്കുന്നതിനൊപ്പം ഇന്റർനെറ്റ് പെർമിഷൻ കൊടുക്കുന്ന സ്റ്റെപ്പ്
      - name: Configure Android Manifest and Build Settings
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-webcam-app
          path: build/app/outputs/flutter-apk/app-release.apk
